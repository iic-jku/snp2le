version = 1

# Files that cannot carry an SPDX header (configs, documentation, schematics and
# symbols, generated netlists, example Touchstone data, figures and result tables)
# are annotated here.  Source files (Python scripts and workflows) carry their own
# SPDX headers, so the license check still catches new source files without
# licensing information.

[[annotations]]
path = [".designinit", ".gitattributes", ".gitignore", "CITATION.cff", "MANIFEST.in", "pyproject.toml", "README.md", "requirements.txt"]
SPDX-FileCopyrightText = "2026 Simon Dorrer"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "doc/**"
SPDX-FileCopyrightText = "2026 Simon Dorrer"
SPDX-License-Identifier = "Apache-2.0"

# Generated by snp2le on every export, so an inline header would not survive.
[[annotations]]
path = ["netlist/**", "testbenches/xschem/sim_range.inc", "testbenches/xschem/sim_range.spice"]
SPDX-FileCopyrightText = "2026 Simon Dorrer"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["schematic/xschem/*.sym", "schematic/xschem/xschemrc", "testbenches/xschem/xschemrc"]
SPDX-FileCopyrightText = "2026 Simon Dorrer"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["testbenches/xschem/plot_simulations/data/**", "testbenches/xschem/plot_simulations/figures/**"]
SPDX-FileCopyrightText = "2026 Simon Dorrer"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["snp2le/examples/**", "snp2le/gui/assets/**"]
SPDX-FileCopyrightText = "2026 Simon Dorrer"
SPDX-License-Identifier = "Apache-2.0"
